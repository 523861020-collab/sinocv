<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#000;color:#fff}
.login-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.95);z-index:9999;display:flex;align-items:center;justify-content:center}
.login-box{background:#0d0d0d;border:1px solid #222;border-radius:12px;padding:36px 28px;width:320px;text-align:center}
.login-box h2{color:#f59e0b;font-size:16px;margin-bottom:20px}
.login-box input{width:100%;padding:10px;border-radius:6px;border:1px solid #222;background:#000;color:#fff;font-size:14px;margin-bottom:12px;outline:none}
.login-box button{width:100%;padding:10px;border-radius:6px;border:none;background:#f59e0b;color:#000;font-weight:700;font-size:14px;cursor:pointer}
.login-box .err{color:#f87171;font-size:11px;margin-top:8px}
.app{display:none}.app.show{display:flex;min-height:100vh}
.sidebar{width:180px;background:#0a0a0a;border-right:1px solid #1a1a1a;padding:20px 0;flex-shrink:0}
.sidebar .logo{padding:0 14px 20px;font-size:15px;font-weight:700;color:#f59e0b}
.sidebar .user{padding:0 14px 8px;font-size:10px;color:#666}
.sidebar a{display:block;padding:10px 14px;color:#888;font-size:13px;text-decoration:none;cursor:pointer}
.sidebar a:hover,.sidebar a.on{color:#f59e0b;background:#111}
.main{flex:1;overflow-y:auto;max-height:100vh}
.bar{padding:14px 20px;border-bottom:1px solid #1a1a1a;display:flex;justify-content:space-between;align-items:center}
.bar h1{font-size:15px}.bar span{font-size:11px;color:#666}
.content{padding:20px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.card{background:#0d0d0d;border:1px solid #1a1a1a;border-radius:10px;padding:16px;text-align:center}
.card .n{font-size:26px;font-weight:700;color:#f59e0b}.card .l{font-size:11px;color:#666;margin-top:4px}
.panel{background:#0d0d0d;border:1px solid #1a1a1a;border-radius:10px;padding:16px;margin-bottom:16px}
.panel h2{font-size:13px;color:#f59e0b;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:11px}
th{text-align:left;padding:6px 8px;color:#666;border-bottom:1px solid #1a1a1a;font-weight:400;white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid #111}
.flex-row{display:flex;gap:20px;margin-bottom:16px}
.filter{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filter select,.filter input{padding:6px 10px;border-radius:6px;border:1px solid #222;background:#0d0d0d;color:#fff;font-size:12px;outline:none}
.tab{display:none}.tab.show{display:block}
.badge{display:inline-block;padding:2px 6px;border-radius:3px;font-size:9px;font-weight:600}
.br{background:#450a0a;color:#f87171}.by{background:#451a03;color:#f59e0b}.bg{background:#1a1a1a;color:#666}.bgn{background:#052e16;color:#34d399}
.logout{font-size:10px;color:#666;cursor:pointer;padding:10px 14px}.logout:hover{color:#f87171}
.adm{display:none}.ovf{overflow:auto}
.donut-wrap{position:relative;width:160px;height:160px;flex-shrink:0}
.donut-wrap svg{transform:rotate(-90deg)}
.donut-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.donut-center .total{font-size:22px;font-weight:700;color:#f59e0b}.donut-center .label{font-size:10px;color:#666}
.legend{font-size:10px;flex:1}.legend div{margin:3px 0;display:flex;align-items:center;gap:6px}
.legend .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
